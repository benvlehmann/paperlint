[project]
name = "paperlint"
version = "0.1.0"
description = "Lint LaTeX papers against a house style"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Benjamin V. Lehmann", email = "benvlehmann@gmail.com" },
]
keywords = ["latex", "linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.urls]
Repository = "https://github.com/benvlehmann/paperlint"

[project.scripts]
paperlint = "paperlint.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paperlint*"]
